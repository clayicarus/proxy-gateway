# Include this server block from nginx's http context.
# Copy configs/masquerade-site/ to /var/www/field-notes/ first.
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /var/www/field-notes;
    index index.html;

    # Match the public UDP port in gateway-website.yaml, including any NAT mapping.
    add_header Alt-Svc 'h3=":443"; ma=3600' always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Publish token subscriptions through the same HTTPS website listener.
    location /sub/ {
        proxy_pass http://127.0.0.1:9091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
