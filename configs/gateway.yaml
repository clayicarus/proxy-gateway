# Proxy Gateway 示例配置

# 具名入站。Hysteria2 使用 UDP，Trojan 使用 TCP；两者可共用数值端口。
inbounds:
  - name: hy2-public
    type: hysteria2
    listen: :8443
    # QUIC 参数调优（可选）
    # quic:
    #   maxIdleTimeout: 30s
    #   maxIncomingStreams: 1024
  # - name: trojan-public
  #   type: trojan
  #   listen: :8443
  #   trojan:
  #     handshakeTimeout: 10s
  #     maxPendingConnections: 256
  #     # 只回收双向都没有数据报的 UDP association
  #     udpIdleTimeout: 60s

# TLS 证书文件
tls:
  cert: ./cert.pem
  key: ./key.pem

# obfs 与 masquerade 未接入 Gateway 数据面，配置后会明确拒绝启动。

# ============================================================
# 管理后台（必须只绑定 loopback）
# ============================================================
admin:
  listen: "127.0.0.1:9090"

# SQLite 数据库路径
dbPath: ./traffic.db

# 流量统计刷新间隔
trafficFlushInterval: 10s

# 自然月流量统计时区；SQLite 内部时间始终为 UTC
timezone: "Asia/Shanghai"

# systemd 直接守护本进程。watchdog 仅在 unit 设置 WatchdogSec 时启用。
systemd:
  unit: "proxy-gateway.service"
  watchdog: true

# ============================================================
# 订阅服务（对用户公网开放，与本地管理后台分离）
# ============================================================
sub:
  listen: "127.0.0.1:9091"        # 可由 Nginx 反向代理到公网
  publicURL: "https://sub.example.com/sub/"
  inbound: "hy2-public"
  serverAddr: "gateway.example.com:8443"
  sni: "gateway.example.com"
  insecure: false

# 用户和节点均由 SQLite 管理。如需导入旧 YAML，请执行：
# migrate -c /etc/proxy-gateway/legacy-gateway.yaml
# 迁移时使用 sub.secret（缺省时 api.secret）计算旧订阅链接。
