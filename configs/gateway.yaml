# Proxy Gateway example configuration

# Named inbounds. Hysteria2 uses UDP and Trojan uses TCP; ports may match.
inbounds:
  - name: hy2-public
    type: hysteria2
    listen: :8443
    # Optional QUIC tuning.
    # quic:
    #   maxIdleTimeout: 30s
    #   maxIncomingStreams: 1024
    # Optional website for unauthenticated HTTP/3 requests.
    # Without masquerade, unauthenticated requests receive 404.
    # masquerade:
    #   type: proxy
    #   proxy:
    #     url: http://127.0.0.1:8080
    #     rewriteHost: true
  # - name: trojan-public
  #   type: trojan
  #   listen: :8443
  #   trojan:
  #     handshakeTimeout: 10s
  #     maxPendingConnections: 256
  #     # Reclaim UDP associations idle in both directions.
  #     udpIdleTimeout: 60s

# TLS certificate files.
tls:
  cert: ./cert.pem
  key: ./key.pem

# obfs is unsupported. Configure masquerade per Hysteria2 inbound above.

# ============================================================
# Management panel (loopback only).
# ============================================================
admin:
  listen: "127.0.0.1:9090"

# SQLite database path.
dbPath: ./traffic.db

# Traffic flush interval.
trafficFlushInterval: 10s

# Calendar-month timezone; SQLite timestamps always use UTC.
timezone: "Asia/Shanghai"

# systemd supervises this process. Watchdog requires WatchdogSec in the unit.
systemd:
  unit: "proxy-gateway.service"
  watchdog: true

# ============================================================
# Public subscriptions, separate from the local management panel.
# ============================================================
sub:
  listen: "127.0.0.1:9091"        # Publish through an HTTPS reverse proxy.
  publicURL: "https://sub.example.com/sub/"
  inbound: "hy2-public"
  serverAddr: "gateway.example.com:8443"
  sni: "gateway.example.com"
  insecure: false

# For Trojan only, enable trojan-public above and select it in sub.inbound.
# To publish both protocols, use configs/gateway-mixed.yaml and sub.endpoints.
# Every published inbound needs its own explicit public address and TLS settings.

# Users and nodes are managed in SQLite. To import legacy YAML, run:
# migrate -c /etc/proxy-gateway/legacy-gateway.yaml
# Migration uses sub.secret (or api.secret) to preserve legacy subscription URLs.
