# Proxy Gateway 示例配置

# 监听地址
listen: :8443

# TLS 证书文件
tls:
  cert: ./cert.pem
  key: ./key.pem

# 混淆（可选，需要客户端也配置相同密码）
# obfs:
#   type: salamander
#   salamander:
#     password: your_obfs_password

# QUIC 参数调优（可选）
# quic:
#   maxIdleTimeout: 30s
#   maxIncomingStreams: 1024

# 伪装（可选，用于抗审查）
# masquerade:
#   type: proxy
#   proxy:
#     url: https://www.bing.com
#     rewriteHost: true

# ============================================================
# 管理后台（必须只绑定 loopback）
# ============================================================
admin:
  listen: "127.0.0.1:9090"

# SQLite 数据库路径
dbPath: ./traffic.db

# 流量统计刷新间隔
trafficFlushInterval: 10s

# 自然月流量统计时区；SQLite 内部时间始终为 UTC
timezone: "Asia/Shanghai"

# systemd 直接守护本进程。watchdog 仅在 unit 设置 WatchdogSec 时启用。
systemd:
  unit: "proxy-gateway.service"
  watchdog: true

# ============================================================
# 订阅服务（对用户公网开放，与本地管理后台分离）
# ============================================================
sub:
  listen: "127.0.0.1:9091"        # 可由 Nginx 反向代理到公网
  publicURL: "https://sub.example.com/sub/"
  serverAddr: "gateway.example.com:8443"
  sni: "gateway.example.com"
  insecure: false

# 用户和节点均由 SQLite 管理。如需导入旧 YAML，请执行：
# proxy-gateway migrate -c /etc/proxy-gateway/legacy-gateway.yaml
# 迁移时使用 sub.secret（缺省时 api.secret）计算旧订阅链接。
