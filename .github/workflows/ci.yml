name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Unit, integration and real loopback protocol tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Bounded Trojan parser fuzzing
        run: go test ./internal/trojan -run='^$' -fuzz=FuzzParseRequest -fuzztime=30s -parallel=2
      - name: Build
        run: go build -trimpath -o build/proxy-gateway ./cmd/gateway
      - name: Formatting and whitespace
        run: |
          test -z "$(gofmt -l cmd internal test)"
          git diff --check
